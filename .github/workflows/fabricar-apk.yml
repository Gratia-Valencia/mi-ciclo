name: 🐱 Fabricar APK de Mi ciclo

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Número de versión (por ejemplo 1.0)'
        required: true
        default: '1.0'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Coger el proyecto
        uses: actions/checkout@v5

      - name: ☕ Preparar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 🤖 Preparar Android
        uses: android-actions/setup-android@v3

      - name: 🔐 Sacar la llave de firma de los secretos
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "❌ Falta el secreto KEYSTORE_BASE64"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > mi-ciclo.keystore

      - name: 🔢 Poner el número de versión
        run: |
          CODE=${{ github.run_number }}
          sed -i "s/versionCode [0-9]*/versionCode $CODE/" app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"${{ inputs.version }}\"/" app/build.gradle

      - name: 🛠️ Fabricar la app
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: ✍️ Firmar la app
        env:
          PW: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk alineada.apk
          "$BT/apksigner" sign --ks mi-ciclo.keystore --ks-key-alias miciclo --ks-pass env:PW --key-pass env:PW --out "Mi-ciclo-${{ inputs.version }}.apk" alineada.apk
          "$BT/apksigner" verify "Mi-ciclo-${{ inputs.version }}.apk"
          rm -f mi-ciclo.keystore

      - name: 🚀 Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ inputs.version }}" "Mi-ciclo-${{ inputs.version }}.apk" \
            --title "Mi ciclo ${{ inputs.version }} 🌸" \
            --notes "Descarga el archivo .apk de aquí abajo, ábrelo en tu móvil Android y dale a Instalar 🐱🌸 Tus datos del ciclo se quedan solo en tu móvil."
